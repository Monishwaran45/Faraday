[project]
name = "faraday"
version = "1.0.0"
description = "Faraday: 100% Air-gapped on-device AI code review & assurance copilot for Qualcomm Snapdragon Hexagon NPU"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Faraday AI Team" }
]
keywords = ["snapdragon", "npu", "qnn", "qualcomm", "code-review", "security", "offline-ai", "faraday"]
dependencies = [
    "click>=8.1.0",
    "rich>=13.7.0",
    "qai-hub>=0.55.0",
    "qai-hub-models>=0.63.0",
    "onnxruntime-genai>=0.9.2",
    "onnx>=1.18.0",
    "transformers>=4.40.0",
    "torch>=2.2.0",
    "wmi>=1.5.1",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
faraday = "backend.cli:main"
codeguard = "backend.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
