name: Faraday Security & Code Assurance Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  faraday-audit:
    name: Faraday On-Device Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Faraday
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Faraday PR Security Scan with Annotations & SARIF
        id: faraday_scan
        run: |
          mkdir -p review_output
          faraday scan . --once --sarif review_output/faraday.sarif --pr-annotations --fail-on HIGH

      - name: Upload SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: review_output/faraday.sarif
          category: faraday-security-audit

      - name: Upload Generated Review Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faraday-security-reports
          path: review_output/
